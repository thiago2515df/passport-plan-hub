services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: passport-plan-hub
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - default
      - caddy-sites

networks:
  caddy-sites:
    external: true
    name: deskcommcrm_caddy-sites
