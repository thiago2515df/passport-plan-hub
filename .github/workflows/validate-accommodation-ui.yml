name: Validar interface de hospedagens

on:
  push:
    branches:
      - feature/airbnb-catalogo-propostas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar compilação do site
        run: npm run build
