name: Validar interface de hospedagens

on:
  push:
    branches:
      - feature/airbnb-catalogo-propostas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Verificar compilação do site
        run: bun run build
