name: Apply selected flight model

on:
  push:
    paths:
      - '.github/workflows/apply-selected-flight-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch packages page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()
          imp = 'import { SelectedFlightsSummary } from "@/components/SelectedFlightsSummary";\n'
          anchor = 'import { FlightPicker } from "@/components/FlightPicker";\n'
          if imp not in s:
              s = s.replace(anchor, anchor + imp)

          start_marker = '        {(pickF.out || pickF.back) && <div className="mt-3 space-y-2">'
          end_marker = '\n        {transport.mode === "air" && <label'
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = '''        <SelectedFlightsSummary
          outbound={pickF.out}
          inbound={pickF.back}
          outboundDate={s.checkin}
          inboundDate={s.checkout}
          onShowOptions={direction => {
            const target = direction === "out" ? outboundRef.current : returnRef.current;
            target?.scrollIntoView({ behavior: "smooth", block: "start" });
            target?.focus({ preventScroll: true });
          }}
          onRemove={direction => {
            const next = { ...pickF, [direction]: undefined };
            setPickF(next);
            setLink("");
            setS(prev => {
              const t = prev.transport;
              if (!t) return prev;
              return { ...prev, transport: { ...t, price: (next.out?.price ?? 0) + (next.back?.price ?? 0) } };
            });
          }}
        />'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          css_path = Path('src/styles.css')
          css = css_path.read_text()
          marker = '/* Selected flight cards — modelo visual com logos das companhias */'
          if marker not in css:
              css += r'''

/* Selected flight cards — modelo visual com logos das companhias */
.selected-flights-summary {
  display: grid;
  gap: 16px;
  margin-top: 16px;
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #16213a;
}

.selected-flight-wrapper {
  width: 100%;
}

.selected-flight-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 7px;
  padding: 0 2px;
}

.selected-flight-heading h3 {
  margin: 0;
  color: #15213b;
  font-size: 15px;
  line-height: 1.1;
  font-weight: 800;
}

.selected-flight-heading > div:first-child > span {
  display: block;
  margin-top: 2px;
  color: #8190aa;
  font-size: 10px;
}

.selected-flight-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.selected-flight-actions button {
  display: inline-flex;
  height: 32px;
  align-items: center;
  justify-content: center;
  border: 1px solid #cfd8e7;
  border-radius: 8px;
  background: #fff;
  color: #15213b;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: .18s ease;
}

.selected-flight-actions button:first-child {
  width: 34px;
  padding: 0;
}

.selected-flight-actions button:first-child svg {
  width: 15px;
  height: 15px;
}

.selected-flight-actions button:last-child {
  padding: 0 12px;
}

.selected-flight-actions button:hover {
  border-color: #2744e6;
  background: #f5f8ff;
}

.selected-flight-card {
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr) 185px;
  min-height: 132px;
  overflow: hidden;
  border: 2px solid #2744e6;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 3px 10px rgba(16, 40, 80, .04);
}

.selected-flight-airline {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px 12px;
}

.selected-flight-airline img {
  display: block;
  width: 88px;
  max-height: 58px;
  object-fit: contain;
}

.selected-flight-airline-fallback {
  max-width: 95px;
  overflow: hidden;
  color: #263ed5;
  font-size: 19px;
  line-height: 1.1;
  font-weight: 900;
  text-align: center;
  text-overflow: ellipsis;
}

.selected-flight-details {
  min-width: 0;
  padding: 12px 18px 9px;
}

.selected-flight-class {
  margin-bottom: 7px;
  color: #71809b;
  font-size: 10px;
  line-height: 1.2;
  font-weight: 700;
}

.selected-flight-class span {
  padding: 0 4px;
}

.selected-flight-route {
  display: grid;
  grid-template-columns: 90px minmax(100px, 1fr) 90px;
  align-items: center;
  gap: 9px;
}

.selected-flight-point {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 1px;
}

.selected-flight-point-right {
  text-align: right;
}

.selected-flight-point strong {
  color: #111c34;
  font-size: 18px;
  line-height: 1.1;
  font-weight: 800;
}

.selected-flight-point span {
  color: #2c3a51;
  font-size: 12px;
}

.selected-flight-point b {
  color: #17233d;
  font-size: 12px;
  font-weight: 800;
}

.selected-flight-duration {
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.selected-flight-duration > div {
  height: 1px;
  min-width: 16px;
  flex: 1;
  background: #d8deea;
}

.selected-flight-duration > span {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  color: #75839a;
  font-size: 10px;
}

.selected-flight-duration svg {
  width: 12px;
  height: 12px;
}

.selected-flight-info-icons {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 7px;
  color: #8491a8;
}

.selected-flight-info-icons > span {
  display: grid;
  width: 16px;
  height: 16px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
}

.selected-flight-info-icons svg {
  width: 15px;
  height: 15px;
}

.selected-flight-price {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 15px;
  border-left: 1px solid #dce3ee;
  text-align: center;
}

.selected-flight-price > strong {
  color: #14213c;
  font-size: 21px;
  line-height: 1;
  font-weight: 900;
}

.selected-flight-price > span {
  margin-top: 3px;
  color: #8994a8;
  font-size: 9px;
}

.selected-flight-commission {
  margin-top: 7px;
  padding: 5px 11px;
  border-radius: 999px;
  background: #cdf8da;
  color: #14843e;
  font-size: 10px;
  line-height: 1;
  font-weight: 800;
}

.selected-flight-bags {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 8px;
  color: #27354f;
}

.selected-flight-bags svg {
  width: 18px;
  height: 18px;
}

.selected-flight-bag-x {
  position: absolute;
  top: -5px;
  right: -6px;
  width: 14px !important;
  height: 14px !important;
  color: #ef4444;
  stroke-width: 3;
}

.selected-flight-remove {
  position: absolute;
  right: 6px;
  bottom: 6px;
  display: grid;
  width: 27px;
  height: 27px;
  place-items: center;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: #8b98ad;
  cursor: pointer;
}

.selected-flight-remove:hover {
  background: #fff0f0;
  color: #dc2626;
}

.selected-flight-remove svg {
  width: 15px;
  height: 15px;
}

@media (max-width: 900px) {
  .selected-flight-card {
    grid-template-columns: 95px minmax(0, 1fr) 155px;
  }
  .selected-flight-route {
    grid-template-columns: 78px minmax(80px, 1fr) 78px;
  }
  .selected-flight-point strong { font-size: 15px; }
  .selected-flight-price > strong { font-size: 18px; }
}

@media (max-width: 700px) {
  .selected-flight-heading {
    align-items: flex-start;
  }
  .selected-flight-actions button:last-child {
    display: none;
  }
  .selected-flight-card {
    grid-template-columns: 78px minmax(0, 1fr);
  }
  .selected-flight-airline {
    padding: 10px 8px;
  }
  .selected-flight-airline img {
    width: 64px;
    max-height: 44px;
  }
  .selected-flight-details {
    padding: 10px 10px 8px;
  }
  .selected-flight-route {
    grid-template-columns: 1fr auto 1fr;
    gap: 5px;
  }
  .selected-flight-point strong { font-size: 13px; }
  .selected-flight-point span,
  .selected-flight-point b { font-size: 10px; }
  .selected-flight-duration > div { display: none; }
  .selected-flight-price {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: flex-start;
    gap: 8px;
    padding: 8px 12px;
    border-top: 1px solid #dce3ee;
    border-left: 0;
  }
  .selected-flight-price > span { margin: 0; }
  .selected-flight-commission { margin: 0 0 0 auto; }
  .selected-flight-bags { margin: 0 34px 0 2px; }
  .selected-flight-remove { right: 7px; bottom: 8px; }
}
'''
              css_path.write_text(css)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-selected-flight-model.yml
          git add src/routes/_authenticated/pacotes.tsx src/styles.css
          git commit -m 'Aplica cards de voos com logos GOL LATAM e Azul'
          git push
