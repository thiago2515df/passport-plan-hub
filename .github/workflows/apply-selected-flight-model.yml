name: Apply selected flight model

on:
  push:
    paths:
      - '.github/workflows/apply-selected-flight-model.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch packages page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()
          imp = 'import { SelectedFlightsSummary } from "@/components/SelectedFlightsSummary";\n'
          anchor = 'import { FlightPicker } from "@/components/FlightPicker";\n'
          if imp not in s:
              if anchor not in s:
                  raise SystemExit('FlightPicker import anchor not found')
              s = s.replace(anchor, anchor + imp)
          start_marker = '        {(pickF.out || pickF.back) && <div className="mt-3 space-y-2">'
          end_marker = '\n        {transport.mode === "air" && <label'
          if start_marker not in s:
              raise SystemExit('Selected flights block not found')
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          lines = [
              '        <SelectedFlightsSummary',
              '          outbound={pickF.out}',
              '          inbound={pickF.back}',
              '          outboundDate={s.checkin}',
              '          inboundDate={s.checkout}',
              '          onShowOptions={direction => {',
              '            const target = direction === "out" ? outboundRef.current : returnRef.current;',
              '            target?.scrollIntoView({ behavior: "smooth", block: "start" });',
              '            target?.focus({ preventScroll: true });',
              '          }}',
              '          onRemove={direction => {',
              '            const next = { ...pickF, [direction]: undefined };',
              '            setPickF(next);',
              '            setLink("");',
              '            setS(prev => {',
              '              const t = prev.transport;',
              '              if (!t) return prev;',
              '              return { ...prev, transport: { ...t, price: (next.out?.price ?? 0) + (next.back?.price ?? 0) } };',
              '            });',
              '          }}',
              '        />',
          ]
          s = s[:start] + '\n'.join(lines) + s[end:]
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-selected-flight-model.yml
          git add src/routes/_authenticated/pacotes.tsx
          git commit -m 'Aplica cards de voos com logos GOL LATAM e Azul'
          git push
