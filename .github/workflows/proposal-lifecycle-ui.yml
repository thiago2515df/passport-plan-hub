name: Proposal lifecycle UI
on:
  push:
    paths:
      - .github/workflows/proposal-lifecycle-ui.yml
      - src/lib/proposal-lifecycle.server.ts
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply proposal lifecycle UI
        shell: python
        run: |
          from pathlib import Path

          # 1) Run lifecycle maintenance whenever the proposal board/settings are loaded.
          path = Path('src/lib/settings.functions.ts')
          s = path.read_text()
          old = '''export const getSettings = createServerFn({ method: "GET" }).middleware([requireSupabaseAuth]).handler(async ({ context }) => {\n  const { assertAdmin } = await import("./access.server");\n  await assertAdmin(context.supabase, context.userId);'''
          new = '''export const getSettings = createServerFn({ method: "GET" }).middleware([requireSupabaseAuth]).handler(async ({ context }) => {\n  const { assertAdmin } = await import("./access.server");\n  await assertAdmin(context.supabase, context.userId);\n  const { maintainProposalLifecycle } = await import("./proposal-lifecycle.server");\n  await maintainProposalLifecycle();'''
          if old in s and 'maintainProposalLifecycle();\n  const [people' not in s:
              s = s.replace(old, new, 1)

          old = '''export const listMyProposals = createServerFn({ method: "GET" }).middleware([requireSupabaseAuth]).handler(async ({ context }) => {\n  const { data: admin } = await context.supabase.rpc("has_role", { _user_id: context.userId, _role: "admin" });'''
          new = '''export const listMyProposals = createServerFn({ method: "GET" }).middleware([requireSupabaseAuth]).handler(async ({ context }) => {\n  const { maintainProposalLifecycle } = await import("./proposal-lifecycle.server");\n  await maintainProposalLifecycle();\n  const { data: admin } = await context.supabase.rpc("has_role", { _user_id: context.userId, _role: "admin" });'''
          if old in s:
              s = s.replace(old, new, 1)
          path.write_text(s)

          # 2) Public page: show only an expired/unavailable message after validity ends.
          path = Path('src/routes/p/$code.tsx')
          s = path.read_text()
          s = s.replace('import { Building2 } from "lucide-react";', 'import { Building2, Clock3 } from "lucide-react";')
          s = s.replace('''  const [acceptance, setAcceptance] = useState<{ hotelIndex: number; acceptedAt: string; total: number } | null>(null);''', '''  const [acceptance, setAcceptance] = useState<{ hotelIndex: number; acceptedAt: string; total: number } | null>(null);\n  const [state, setState] = useState<"active" | "approved" | "expired" | "cancelled" | "missing" | "loading">("loading");''')
          s = s.replace('''    const refresh = () => fetchProposal({ data: code }).then(r => { if (alive) { setPayload(r.payload); setAcceptance(r.acceptance); } }).catch(() => { if (alive) setPayload(null); });''', '''    const refresh = () => fetchProposal({ data: code }).then(r => { if (alive) { setPayload(r.payload); setAcceptance(r.acceptance); setState(r.state); } }).catch(() => { if (alive) { setPayload(null); setState("missing"); } });''')
          old = '''  if (!p) {\n    return (\n      <div className="grid min-h-screen place-items-center bg-background text-muted-foreground">\n        <div className="rounded-2xl border border-border bg-card p-8 text-center shadow-md">\n          <Building2 className="mx-auto mb-3 h-12 w-12 text-primary/60" />\n          <h2 className="text-xl font-semibold text-foreground">Proposta inválida ou expirada</h2>\n          <p className="mt-1 text-sm">Verifique o link recebido com o seu agente.</p>\n        </div>\n      </div>\n    );\n  }'''
          new = '''  if (!p) {\n    const unavailable = state === "expired" || state === "cancelled";\n    return (\n      <div className="grid min-h-screen place-items-center bg-background px-5 text-muted-foreground">\n        <div className="w-full max-w-md rounded-3xl border border-border bg-card p-8 text-center shadow-md">\n          {unavailable ? <Clock3 className="mx-auto mb-4 h-14 w-14 text-primary" /> : <Building2 className="mx-auto mb-4 h-14 w-14 text-primary/60" />}\n          <h2 className="text-2xl font-bold text-foreground">{unavailable ? "Esta proposta está vencida" : "Proposta inválida ou expirada"}</h2>\n          <p className="mx-auto mt-3 max-w-sm text-sm leading-relaxed">{unavailable ? "Esta proposta não está mais válida. Procure o seu agente de viagens para receber uma nova cotação atualizada." : "Verifique o link recebido com o seu agente de viagens."}</p>\n        </div>\n      </div>\n    );\n  }'''
          if old in s:
              s = s.replace(old, new, 1)
          path.write_text(s)

          # 3) Kanban: hide cancelled cards and expose a discreet searchable archive.
          path = Path('src/routes/_authenticated/vendedor.tsx')
          s = path.read_text()
          s = s.replace('GripVertical, Loader2 } from "lucide-react";', 'GripVertical, Loader2, Archive } from "lucide-react";')
          s = s.replace('''const date = (value: string) => new Date(value + "T12:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });''', '''const date = (value: string) => new Date(value + "T12:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });\nconst archiveUntil = (value: string) => new Date(new Date(value).getTime() + 30 * 86400000).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" });''')
          s = s.replace('''  const [dragged, setDragged] = useState<string | null>(null);''', '''  const [dragged, setDragged] = useState<string | null>(null);\n  const [showArchive, setShowArchive] = useState(false);''')
          s = s.replace('''  const filtered = rows.filter(row => { const p = decodeProposal(row.payload); return `${p?.s.cliente ?? ""} ${p?.s.destino ?? ""} ${row.seller_name} ${row.code}`.toLowerCase().includes(q.toLowerCase()); });''', '''  const filtered = rows.filter(row => { const p = decodeProposal(row.payload); return `${p?.s.cliente ?? ""} ${p?.s.destino ?? ""} ${row.seller_name} ${row.code}`.toLowerCase().includes(q.toLowerCase()); });\n  const activeFiltered = filtered.filter(row => row.status !== "cancelled");\n  const archivedFiltered = filtered.filter(row => row.status === "cancelled");\n  const archivedCount = rows.filter(row => row.status === "cancelled").length;''')
          s = s.replace('{rows.length} propostas · {rows.filter(r => r.status === "awaiting").length} aguardando resposta', '{rows.filter(r => r.status !== "cancelled").length} propostas ativas · {rows.filter(r => r.status === "awaiting").length} aguardando resposta')
          old = '''        <div className="mb-4 flex items-center gap-2 border-b border-border pb-4">\n          <Search className="h-4 w-4 text-muted-foreground" />\n          <Input aria-label="Buscar proposta" className="h-9 max-w-md bg-card" placeholder="Cliente, destino ou vendedor" value={q} onChange={e => navigate({ search: { q: e.target.value }, replace: true })} />\n        </div>'''
          new = '''        <div className="mb-4 flex flex-wrap items-center gap-2 border-b border-border pb-4">\n          <Search className="h-4 w-4 text-muted-foreground" />\n          <Input aria-label="Buscar proposta" className="h-9 min-w-0 max-w-md flex-1 bg-card" placeholder={showArchive ? "Buscar no arquivo" : "Cliente, destino ou vendedor"} value={q} onChange={e => navigate({ search: { q: e.target.value }, replace: true })} />\n          <Button type="button" size="sm" variant={showArchive ? "secondary" : "ghost"} className="ml-auto text-xs" onClick={() => setShowArchive(v => !v)}><Archive className="h-4 w-4" />Arquivo{archivedCount ? ` (${archivedCount})` : ""}</Button>\n        </div>'''
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('''{columns.map(column => { const cards = filtered.filter(row => column.id === "closed" ? ["approved", "cancelled"].includes(row.status) : row.status === column.id);''', '''{columns.map(column => { const cards = activeFiltered.filter(row => column.id === "closed" ? row.status === "approved" : row.status === column.id);''')
          marker = '''        </div>\n        <Dialog open={!!pending}'''
          archive = '''        </div>\n        {showArchive && <section className="rounded-2xl border border-border bg-card p-3 sm:p-4"><div className="mb-3 flex items-center justify-between gap-3"><div><h2 className="flex items-center gap-2 text-sm font-semibold"><Archive className="h-4 w-4 text-muted-foreground" />Arquivo de propostas</h2><p className="mt-1 text-[11px] text-muted-foreground">Propostas canceladas ou vencidas ficam aqui por 30 dias e depois são excluídas definitivamente.</p></div><span className="rounded-md bg-secondary px-2 py-1 text-xs font-semibold">{archivedFiltered.length}</span></div><div className="grid gap-2 md:grid-cols-2 xl:grid-cols-3">{archivedFiltered.map(row => { const p = decodeProposal(row.payload); const s = p?.s; return <article key={row.code} className="rounded-xl border border-border bg-secondary/20 p-3 text-xs"><div className="flex items-start justify-between gap-2"><div className="min-w-0"><p className="text-[10px] text-muted-foreground">#{row.code}</p><h3 className="truncate text-sm font-semibold">{s?.cliente || "Cliente não informado"}</h3></div><span className="rounded-md bg-muted px-2 py-0.5 text-[10px] font-semibold text-muted-foreground">Arquivada</span></div><p className="mt-2 flex items-center gap-1.5 text-muted-foreground"><MapPin className="h-3.5 w-3.5" />{s?.origem?.split(",")[0] || "Origem"} → {s?.destino?.split(",")[0] || "Destino"}</p>{s && <p className="mt-1 flex items-center gap-1.5 text-muted-foreground"><CalendarDays className="h-3.5 w-3.5" />{date(s.checkin)} – {date(s.checkout)}</p>}<p className="mt-2 border-t border-border pt-2 text-[10px] text-muted-foreground">Exclusão automática em {archiveUntil(row.updated_at)}</p></article>; })}{!archivedFiltered.length && <div className="col-span-full rounded-xl border border-dashed border-border py-10 text-center text-xs text-muted-foreground">{q ? "Nenhuma proposta arquivada encontrada." : "O arquivo está vazio."}</div>}</div></section>}\n        <Dialog open={!!pending}'''
          if marker in s and 'Arquivo de propostas' not in s:
              s = s.replace(marker, archive, 1)
          path.write_text(s)
      - name: Commit lifecycle changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/settings.functions.ts 'src/routes/p/$code.tsx' src/routes/_authenticated/vendedor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expira propostas em 24h e adiciona arquivo de 30 dias"
          git push
