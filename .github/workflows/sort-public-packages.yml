name: Sort public proposal packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sort-public-packages.yml'

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sort public packages by total price
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/proposta.tsx')
          text = path.read_text()
          old_decl = '  const hotels = p.hotels as Hotel[];\n'
          new_decl = '''  const hotels = p.hotels as Hotel[];\n  const pricedHotels = hotels\n    .map((hotel, originalIndex) => ({ hotel, originalIndex }))\n    .sort((a, b) => a.hotel.total - b.hotel.total || a.originalIndex - b.originalIndex);\n'''
          old_map = '              {hotels.map((h, i) => {\n'
          new_map = '              {pricedHotels.map(({ hotel: h, originalIndex: i }) => {\n'
          if old_decl not in text:
              raise SystemExit('Hotel declaration not found')
          if old_map not in text:
              raise SystemExit('Hotel map not found')
          text = text.replace(old_decl, new_decl, 1).replace(old_map, new_map, 1)
          path.write_text(text)
          PY
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/proposta.tsx
          git rm .github/workflows/sort-public-packages.yml
          git commit -m 'Ordena pacotes públicos do menor para o maior preço'
          git push
