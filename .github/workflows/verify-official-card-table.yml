name: Verify official card fee table
on:
  push:
    paths:
      - '.github/workflows/verify-official-card-table.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test payment tables and dynamic Pix
        run: bunx vitest run src/lib/payment-rules.test.ts
      - name: Build
        run: bun run build
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-official-card-table.yml
          git commit -m "Remove teste temporário tabela cartão"
          git push
