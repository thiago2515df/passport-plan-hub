name: Redesign summary cards

on:
  push:
    paths:
      - '.github/workflows/redesign-summary-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch summary cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()
          start = s.index('            <div ref={summaryRef} tabIndex={-1} aria-label="Resumo da proposta"')
          end = s.index('               {(pickF.out || pickF.back)', start)
          new = '''            <div ref={summaryRef} tabIndex={-1} aria-label="Resumo da proposta" className="scroll-mt-6 rounded-2xl border border-border bg-card p-3 outline-none focus-visible:ring-2 focus-visible:ring-ring">
              <div className="mb-2 flex items-center justify-between border-b border-border pb-2">
                <div className="flex items-center gap-2"><span className="grid h-8 w-8 place-items-center rounded-lg bg-primary/10 text-primary"><CreditCard className="h-4 w-4" /></span><h2 className="text-lg font-bold text-primary">Seu resumo</h2></div>
                <span className="text-xs text-muted-foreground">{sel.length} {sel.length === 1 ? "hotel" : "hotéis"}</span>
              </div>
              {sel.length === 0 && <p className="py-4 text-sm text-muted-foreground">Nenhum hotel selecionado.</p>}
              <div className="space-y-2.5">
                {sel.map(id => { const h = hotels.find(x => x.id === id); if (!h) return null; const hotelSearch = { ...pricingSearch, extras: h.extras ?? [] }; const price = packagePricing(h.total, hotelSearch, commissions.data ?? emptyCommissions); return (
                  <div key={id} className="overflow-hidden rounded-2xl border border-border bg-card shadow-sm">
                    <div className="grid grid-cols-1 gap-0 sm:grid-cols-[92px_minmax(0,1fr)]">
                      <button type="button" onClick={() => setGallery(h)} className="hidden min-h-[150px] overflow-hidden bg-secondary sm:block [&_img]:!h-full [&_img]:!min-h-[150px] [&_img]:!w-full [&_img]:!object-cover [&>div]:!h-full [&>div]:!min-h-[150px] [&>div]:!w-full" aria-label={`Ver fotos de ${h.name}`}><HotelPhoto hotel={h} /></button>
                      <div className="min-w-0 p-2.5">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0"><button type="button" onClick={() => setGallery(h)} className="block max-w-full truncate text-left text-sm font-bold text-foreground hover:underline">{h.name}</button><div className="mt-0.5 flex items-center gap-1 truncate text-[10px] text-muted-foreground"><MapPin className="h-3 w-3 shrink-0 text-primary" /><span className="truncate">{h.address}</span></div></div>
                          <button aria-label="Remover" onClick={() => toggle(id)} className="grid h-8 w-8 shrink-0 place-items-center rounded-lg border border-border bg-secondary/60 text-muted-foreground hover:text-destructive"><Trash2 className="h-4 w-4" /></button>
                        </div>

                        <div className="mt-2 grid gap-1.5 sm:grid-cols-3">
                          <label className="rounded-xl border border-border bg-secondary/40 px-2.5 py-2"><span className="block text-[10px] text-muted-foreground">Hospedagem</span><input aria-label={`Custo de ${h.name}`} type="number" min={0} step="0.01" value={h.total} onChange={e => { const total = Math.max(0, Number(e.target.value)); setHotels(previous => previous.map(item => item.id === id ? { ...item, total, nightly: total / nights } : item)); setLink(""); }} className="mt-0.5 w-full bg-transparent text-sm font-bold outline-none [appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none" /></label>
                          <div className="rounded-xl border border-border bg-secondary/40 px-2.5 py-2"><span className="block text-[10px] text-muted-foreground">Serviços</span><strong className="text-sm">{brl(price.cost)}</strong></div>
                          <div className="rounded-xl border border-border bg-secondary/40 px-2.5 py-2"><span className="block text-[10px] text-muted-foreground">Comissão</span><strong className="text-sm">{brl(price.commission)}</strong></div>
                        </div>

                        <div className="mt-2 border-t border-border pt-2">
                          <div className="flex flex-wrap items-center gap-1.5"><span className="mr-1 text-[10px] font-semibold">Serviços adicionais</span>{["Almoço", "Passeio"].map(n => <Button key={n} variant="outline" size="sm" className="h-7 rounded-full px-2.5 text-[10px]" onClick={() => { setLink(""); setHotels(previous => previous.map(hotel => hotel.id === id ? { ...hotel, extras: [...(hotel.extras ?? []), { name: n, cost: 0 }] } : hotel)); }}>+ {n}</Button>)}<Button variant="outline" size="sm" className="h-7 rounded-full px-2.5 text-[10px]" onClick={() => { setLink(""); setHotels(previous => previous.map(hotel => hotel.id === id ? { ...hotel, extras: [...(hotel.extras ?? []), { name: "", cost: 0 }] } : hotel)); }}>+ Adicionar serviço</Button></div>
                          {(h.extras ?? []).length > 0 && <div className="mt-2 space-y-1.5">{(h.extras ?? []).map((item, i) => <div key={i} className="grid grid-cols-[minmax(0,1fr)_82px_30px] gap-1.5"><Input className="h-8 rounded-lg text-xs" aria-label={`Serviço adicional ${i + 1} de ${h.name}`} placeholder="Ex.: Almoço" value={item.name} onChange={e => { setLink(""); setHotels(previous => previous.map(hotel => hotel.id === id ? { ...hotel, extras: (hotel.extras ?? []).map((v, j) => j === i ? { ...v, name: e.target.value } : v) } : hotel)); }} /><Input className="h-8 rounded-lg text-xs" aria-label={`Valor do serviço adicional ${i + 1} de ${h.name}`} type="number" min={0} step="0.01" value={item.cost} onChange={e => { setLink(""); setHotels(previous => previous.map(hotel => hotel.id === id ? { ...hotel, extras: (hotel.extras ?? []).map((v, j) => j === i ? { ...v, cost: Math.max(0, Number(e.target.value)) } : v) } : hotel)); }} /><Button aria-label={`Remover serviço adicional ${i + 1} de ${h.name}`} variant="ghost" size="icon" className="h-8 w-8" onClick={() => { setLink(""); setHotels(previous => previous.map(hotel => hotel.id === id ? { ...hotel, extras: (hotel.extras ?? []).filter((_, j) => j !== i) } : hotel)); }}><Trash2 className="h-3.5 w-3.5" /></Button></div>)}</div>}
                        </div>

                        <div className="mt-2 flex items-center justify-between rounded-xl border border-primary/15 bg-primary/5 px-3 py-2"><span className="text-[11px] font-semibold text-primary">Preço final do pacote</span><strong className="text-lg font-black text-primary">{brl(price.total)}</strong></div>
                      </div>
                    </div>
                  </div>); })}
               </div>
'''
          s = s[:start] + new + s[end:]
          p.write_text(s)
          PY
      - name: Install and build
        run: npm ci && npm run build
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/redesign-summary-cards.yml
          git add src/routes/_authenticated/pacotes.tsx
          git commit -m 'Compacta resumo e adiciona fotos dos hotéis'
          git push
