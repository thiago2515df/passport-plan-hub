name: Require client name

on:
  push:
    paths:
      - '.github/workflows/require-client-name.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch packages page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()

          state_anchor = '  const [saving, setSaving] = useState(false);\n'
          state_insert = '  const [clientNameError, setClientNameError] = useState("");\n'
          if state_insert not in s:
              if state_anchor not in s:
                  raise SystemExit('saving state anchor not found')
              s = s.replace(state_anchor, state_anchor + state_insert, 1)

          gerar_anchor = '  const gerar = async () => {\n'
          gerar_insert = '''  const gerar = async () => {\n    const clientName = s.cliente?.trim();\n    if (!clientName) {\n      setClientNameError("Preencha o nome do cliente para gerar a proposta.");\n      return;\n    }\n    setClientNameError("");\n'''
          if 'const clientName = s.cliente?.trim();' not in s:
              if gerar_anchor not in s:
                  raise SystemExit('gerar anchor not found')
              s = s.replace(gerar_anchor, gerar_insert, 1)

          old_destructure = '      const { extras: _extras, ...proposalSearch } = s;\n'
          new_destructure = '      const { extras: _extras, telefone: _telefone, email: _email, ...proposalSearch } = s;\n'
          if old_destructure in s:
              s = s.replace(old_destructure, new_destructure, 1)

          old_payload = 'payload: encodeProposal({ s: { ...proposalSearch, hospedes: hosp, destinationId: destId, rooms, adults, childAges: kids }, hotels: chosen })'
          new_payload = 'payload: encodeProposal({ s: { ...proposalSearch, cliente: clientName, hospedes: hosp, destinationId: destId, rooms, adults, childAges: kids }, hotels: chosen })'
          if old_payload in s:
              s = s.replace(old_payload, new_payload, 1)

          old_inputs = '''        <input disabled={editLoading} placeholder="Nome do cliente" value={s.cliente ?? ""} onChange={e => { setLink(""); setS({ ...s, cliente: e.target.value }); }} className="mt-4 w-full rounded-xl border border-border bg-card px-3 py-2 text-sm" /><input aria-label="Telefone do cliente" placeholder="Telefone do cliente" type="tel" value={s.telefone ?? ""} onChange={e => setS({ ...s, telefone: e.target.value })} className="mt-2 w-full rounded-lg border border-border bg-card px-3 py-2 text-sm" /><input aria-label="E-mail do cliente" placeholder="E-mail do cliente" type="email" value={s.email ?? ""} onChange={e => setS({ ...s, email: e.target.value })} className="mt-2 w-full rounded-lg border border-border bg-card px-3 py-2 text-sm" />'''
          new_inputs = '''        <div className="mt-4">\n          <label htmlFor="client-name" className="mb-1 flex items-center justify-between text-sm font-semibold text-foreground">\n            <span>Nome do cliente</span>\n            <span className="text-xs font-bold text-destructive">* obrigatório</span>\n          </label>\n          <input\n            id="client-name"\n            required\n            disabled={editLoading}\n            aria-invalid={!!clientNameError}\n            aria-describedby={clientNameError ? "client-name-error" : undefined}\n            placeholder="Digite o nome do cliente"\n            value={s.cliente ?? ""}\n            onChange={e => { setLink(""); setClientNameError(""); setS({ ...s, cliente: e.target.value }); }}\n            className={`w-full rounded-xl border bg-card px-3 py-3 text-sm outline-none transition ${clientNameError ? "border-destructive ring-2 ring-destructive/25" : "border-border focus:border-primary focus:ring-2 focus:ring-primary/20"}`}\n          />\n          {clientNameError && (\n            <div id="client-name-error" role="alert" className="mt-3 rounded-xl border-2 border-destructive bg-destructive/10 px-4 py-4 text-center text-lg font-extrabold text-destructive shadow-sm">\n              ⚠️ {clientNameError}\n            </div>\n          )}\n        </div>'''
          if old_inputs not in s:
              raise SystemExit('client input block not found')
          s = s.replace(old_inputs, new_inputs, 1)

          p.write_text(s)
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/require-client-name.yml
          git add src/routes/_authenticated/pacotes.tsx
          git commit -m 'Exige nome do cliente e remove telefone e email'
          git push
