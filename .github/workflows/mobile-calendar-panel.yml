name: Mobile calendar panel

on:
  push:
    paths:
      - '.github/workflows/mobile-calendar-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply mobile calendar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()
          anchor = 'import { Calendar as DayPicker } from "@/components/ui/calendar";\n'
          imp = 'import { MobileDateRangeSheet } from "@/components/MobileDateRangeSheet";\n'
          if imp not in s:
              s = s.replace(anchor, anchor + imp, 1)
          state_anchor = '  const [calMonth, setCalMonth] = useState<Date>(() => toD("2026-11-16"));\n'
          state = '  const [mobileCalendarOpen, setMobileCalendarOpen] = useState(false);\n'
          if state not in s:
              s = s.replace(state_anchor, state_anchor + state, 1)
          replacement = '''<div className="text-sm">Ida e volta
        <button type="button" onClick={() => setMobileCalendarOpen(true)} className={field + " mt-2 w-full text-left lg:hidden"}><Calendar className="h-4 w-4" />{fmtD(s.checkin)} → {fmtD(s.checkout)}</button>
        <div className="hidden lg:block"><Popover><PopoverTrigger asChild><button type="button" className={field + " mt-2 w-full text-left"}><Calendar className="h-4 w-4" />{fmtD(s.checkin)} → {fmtD(s.checkout)}</button></PopoverTrigger><PopoverContent className="w-auto p-0" align="start"><DayPicker mode="range" locale={ptBR} numberOfMonths={2} month={calMonth} onMonthChange={setCalMonth} disabled={{ before: new Date() }} selected={{ from: toD(s.checkin), to: picking ? undefined : toD(s.checkout) }} onSelect={(_r, day) => { if (!day) return; if (!picking || day <= toD(s.checkin)) { setS(prev => ({ ...prev, checkin: isoD(day), checkout: isoD(new Date(day.getTime() + 86400000)) })); setPicking(true); return; } setS(prev => ({ ...prev, checkout: isoD(day) })); setPicking(false); }} className="pointer-events-auto p-3" /><p className="px-3 pb-3 text-xs text-muted-foreground">{picking ? "Agora clique no dia da volta." : "Clique na ida e depois na volta."} {nights} {nights === 1 ? "noite" : "noites"}.</p></PopoverContent></Popover></div>
        <MobileDateRangeSheet open={mobileCalendarOpen} from={toD(s.checkin)} to={toD(s.checkout)} onClose={() => setMobileCalendarOpen(false)} onConfirm={({ from, to }) => { setS(prev => ({ ...prev, checkin: isoD(from), checkout: isoD(to) })); setCalMonth(from); setPicking(false); setMobileCalendarOpen(false); }} />
      </div>'''
          pattern = re.compile(r'<div className="text-sm">Ida e volta<Popover>.*?</Popover></div>', re.S)
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'calendar field replacement failed: {count}')
          p.write_text(s)
          css = Path('src/mobile-dashboard.css')
          c = css.read_text()
          if '/* Mobile full-screen date range */' not in c:
              c += '''\n\n/* Mobile full-screen date range */\n@media (max-width: 1023px) {\n  .mobile-date-sheet { overscroll-behavior: contain; -webkit-tap-highlight-color: transparent; }\n  .mobile-date-sheet [data-slot="calendar"] { width: 100%; }\n  .mobile-date-sheet button[data-range-middle="true"] { border-radius: 0 !important; background: color-mix(in srgb, var(--color-primary) 14%, white) !important; color: var(--color-primary) !important; }\n  .mobile-date-sheet button[data-range-start="true"], .mobile-date-sheet button[data-range-end="true"] { background: var(--color-primary) !important; color: var(--color-primary-foreground) !important; font-weight: 800; }\n  .mobile-date-sheet button[data-range-start="true"] { border-radius: 999px 0 0 999px !important; }\n  .mobile-date-sheet button[data-range-end="true"] { border-radius: 0 999px 999px 0 !important; }\n  .mobile-date-sheet button[data-range-start="true"][data-range-end="true"] { border-radius: 999px !important; }\n  .mobile-date-sheet [data-slot="calendar"] button { min-height: 42px; font-size: 15px; }\n}\n'''
          css.write_text(c)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/pacotes.tsx src/mobile-dashboard.css
          git commit -m 'Adapta calendário do painel para celular'
          git push
