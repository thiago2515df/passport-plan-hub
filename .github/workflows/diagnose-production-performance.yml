name: Diagnose production performance
on:
  push:
    paths:
      - '.github/workflows/diagnose-production-performance.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Curl timing samples
        shell: bash
        run: |
          set -e
          urls=(
            "https://propostasbsb.excursaobrasilia.com.br/"
            "https://propostasbsb.excursaobrasilia.com.br/auth"
            "https://propostasbsb.excursaobrasilia.com.br/pacotes"
            "https://propostasbsb.excursaobrasilia.com.br/p/mn2qafbf"
          )
          for url in "${urls[@]}"; do
            echo "=== $url ==="
            for i in 1 2 3 4 5; do
              curl -L -sS -o /tmp/body \
                -w "run=$i code=%{http_code} bytes=%{size_download} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s ttfb=%{time_starttransfer}s total=%{time_total}s final=%{url_effective}\n" \
                --max-time 45 "$url" || true
            done
          done
      - name: Install Lighthouse
        run: npm install -g lighthouse@12
      - name: Lighthouse auth
        continue-on-error: true
        run: lighthouse "https://propostasbsb.excursaobrasilia.com.br/auth" --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path=/tmp/auth.json --quiet
      - name: Lighthouse public proposal
        continue-on-error: true
        run: lighthouse "https://propostasbsb.excursaobrasilia.com.br/p/mn2qafbf" --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path=/tmp/proposal.json --quiet
      - name: Print Lighthouse summary
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for (const [name,path] of [['auth','/tmp/auth.json'],['proposal','/tmp/proposal.json']]) {
            if (!fs.existsSync(path)) { console.log(name,'NO_REPORT'); continue; }
            const j=JSON.parse(fs.readFileSync(path,'utf8'));
            const a=j.audits;
            console.log('LIGHTHOUSE',name,JSON.stringify({
              score:j.categories.performance.score,
              FCP:a['first-contentful-paint']?.numericValue,
              LCP:a['largest-contentful-paint']?.numericValue,
              TBT:a['total-blocking-time']?.numericValue,
              CLS:a['cumulative-layout-shift']?.numericValue,
              SI:a['speed-index']?.numericValue,
              TTI:a['interactive']?.numericValue,
              transfer:a['total-byte-weight']?.numericValue,
              requests:a['network-requests']?.details?.items?.length
            }));
          }
          NODE
      - name: Build and bundle sizes
        run: |
          bun install --frozen-lockfile
          bun run build
          echo "=== Largest build files ==="
          find .output dist -type f 2>/dev/null -printf '%s %p\n' | sort -nr | head -30 || true
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-production-performance.yml
          git commit -m "Remove diagnóstico temporário de performance"
          git push || true
