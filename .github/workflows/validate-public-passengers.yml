name: Verify legacy public passenger counts
on:
  push:
    paths:
      - '.github/workflows/validate-public-passengers.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test traveler counts
        run: bunx vitest run src/lib/customer-package-price.test.ts
      - name: Build web/mobile proposal
        run: bun run build
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-public-passengers.yml
          git commit -m "Remove teste temporário de preço por pessoa"
          git push
