name: Compact proposal kanban

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-proposal-kanban.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compact kanban and seller commission layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def req(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'pattern not found: {label}')
              return text.replace(old, new, 1)

          # Proposal kanban
          path = Path('src/routes/_authenticated/vendedor.tsx')
          text = path.read_text()
          text = req(text, 'import { CommissionSettings } from "@/components/CommissionSettings";\n', '', 'commission import')
          text = req(text, '      <main className="min-w-0 flex-1 px-4 py-8 sm:px-7 space-y-10">', '      <main className="min-w-0 flex-1 px-4 py-5 sm:px-6 space-y-5">', 'main spacing')
          text = req(text, '<header className="mb-8 flex flex-wrap items-center justify-between gap-4">', '<header className="mb-4 flex flex-wrap items-center justify-between gap-3">', 'header spacing')
          text = req(text, '<h1 className="text-3xl font-bold">Propostas</h1>', '<h1 className="text-2xl font-bold">Propostas</h1>', 'title size')
          text = req(text, '<p className="mt-2 text-sm text-muted-foreground">{rows.length} propostas · {rows.filter(r => r.status === "awaiting").length} aguardando resposta</p>', '<p className="mt-1 text-xs text-muted-foreground">{rows.length} propostas · {rows.filter(r => r.status === "awaiting").length} aguardando resposta</p>', 'header summary')
          text = req(text, '<div className="mb-7 flex items-center gap-2 border-b border-border pb-5">', '<div className="mb-4 flex items-center gap-2 border-b border-border pb-4">', 'search spacing')
          text = req(text, 'className="max-w-sm bg-card"', 'className="h-9 max-w-md bg-card"', 'search input')
          text = req(text, '        <CommissionSettings userId={user.id} />\n', '', 'remove commission settings')
          text = req(text, '<div className="grid grid-cols-1 items-start gap-5 xl:grid-cols-3">', '<div className="grid grid-cols-1 items-start gap-3 lg:grid-cols-3">', 'board grid')
          text = req(text, 'className="min-w-0">\n            <div className={`mb-4 flex items-center justify-between border-t-2 ${column.line} pt-4`}', 'className="min-w-0 rounded-2xl bg-secondary/30 p-2.5">\n            <div className={`mb-2 flex items-center justify-between border-b-2 ${column.line} pb-2`}', 'column shell')
          text = req(text, '<div className="min-h-64 space-y-3">', '<div className="min-h-40 space-y-2">', 'column cards gap')
          text = req(text, 'className="rounded-lg border border-border bg-card p-4 shadow-sm">', 'className="rounded-xl border border-border bg-card p-3 shadow-none transition hover:border-primary/35">', 'card shell')
          text = req(text, '<div className="mb-3 flex items-start justify-between gap-2"><div><p className="text-[11px] text-muted-foreground">#{row.code}</p><h3 className="mt-1 break-words font-semibold">{s?.cliente || "Cliente não informado"}</h3></div>', '<div className="mb-2 flex items-start justify-between gap-2"><div className="min-w-0"><p className="text-[10px] text-muted-foreground">#{row.code}</p><h3 className="mt-0.5 truncate text-sm font-semibold">{s?.cliente || "Cliente não informado"}</h3></div>', 'card header')
          text = req(text, 'className={`mb-3 inline-flex items-center gap-1 rounded-md px-2 py-1 text-[11px] font-semibold', 'className={`mb-2 inline-flex items-center gap-1 rounded-md px-2 py-0.5 text-[10px] font-semibold', 'status chip')
          text = req(text, '<div className="space-y-2 text-xs">', '<div className="space-y-1.5 text-[11px]">', 'card detail density')
          old = '{!row.acceptance && <>{p?.hotels.map((hotel, index) => <p key={index} className="break-words text-muted-foreground">{hotel.name}</p>)}{minimum !== null && <p className="pt-1 text-base font-bold">{p && p.hotels.length > 1 ? "A partir de " : ""}{brl(minimum)}</p>}{row.status === "approved" && <p className="text-muted-foreground">Aprovação anterior: pacote escolhido não registrado.</p>}</>}'
          new = '{!row.acceptance && <div className="mt-1 flex items-end justify-between gap-3 border-t border-border pt-2"><span className="text-[10px] text-muted-foreground">{p?.hotels.length ?? 0} {p?.hotels.length === 1 ? "hotel" : "hotéis"}</span>{minimum !== null && <p className="text-sm font-bold">{p && p.hotels.length > 1 ? "A partir de " : ""}{brl(minimum)}</p>}</div>}'
          text = req(text, old, new, 'compact hotel summary')
          text = req(text, '{row.acceptance && <AcceptedPackageDetails acceptance={row.acceptance} />}', '{row.acceptance && <details className="mt-2 rounded-lg bg-secondary/50 px-2.5 py-2 text-[11px]"><summary className="cursor-pointer font-semibold text-success-foreground">Pacote aceito · {brl(row.acceptance.total)}</summary><AcceptedPackageDetails acceptance={row.acceptance} /></details>}', 'collapse acceptance')
          text = req(text, '<div className="mt-4 space-y-2 border-t border-border pt-3 text-[11px] text-muted-foreground">', '<div className="mt-3 flex flex-wrap items-center gap-x-3 gap-y-1 border-t border-border pt-2 text-[10px] text-muted-foreground">', 'compact footer')
          text = req(text, '<div className="mt-4 flex flex-wrap gap-2">', '<div className="mt-2 flex flex-wrap gap-1.5">', 'top actions')
          text = req(text, '<div className="mt-3 flex flex-wrap gap-2">', '<div className="mt-2 flex flex-wrap gap-1.5">', 'status actions')
          text = req(text, 'className="flex min-h-48 flex-col items-center justify-center gap-3 rounded-lg border border-dashed border-border text-sm text-muted-foreground"', 'className="flex min-h-32 flex-col items-center justify-center gap-2 rounded-xl border border-dashed border-border text-xs text-muted-foreground"', 'empty state')
          path.write_text(text)

          # Commission component supports a custom title for the administrator card.
          path = Path('src/components/CommissionSettings.tsx')
          text = path.read_text()
          text = req(text, 'export function CommissionSettings({ userId }: { userId: string }) {', 'export function CommissionSettings({ userId, title = "Comissões do vendedor" }: { userId: string; title?: string }) {', 'commission props')
          text = req(text, 'return <section aria-label="Comissões do vendedor" className="mb-6 border-y border-border py-5"><h2 className="mb-4 font-semibold">Comissões do vendedor</h2>', 'return <section aria-label={title} className="mb-4 border-t border-border pt-4"><h2 className="mb-3 text-sm font-semibold">{title}</h2>', 'commission title')
          path.write_text(text)

          # Settings > Sellers: surface administrator and own commission percentages there.
          path = Path('src/routes/_authenticated/configuracoes.tsx')
          text = path.read_text()
          text = req(text, '  const sellers = people.filter(p => data.data?.rights.some(r => r.user_id === p.id));\n', '  const sellers = people.filter(p => data.data?.rights.some(r => r.user_id === p.id));\n  const administrator = people.find(p => p.id === access.userId);\n', 'administrator profile')
          marker = '        <Input aria-label="Buscar vendedor" placeholder="Buscar por nome ou e-mail" value={query} onChange={e => setQuery(e.target.value)} className="mb-4 max-w-sm" />\n'
          admin_block = marker + '        {access.admin && administrator && <div className="mb-5 rounded-xl border border-primary/20 bg-primary/5 p-4"><div className="flex flex-wrap items-start justify-between gap-3"><div><span className="rounded-md bg-primary px-2 py-1 text-[10px] font-bold uppercase text-primary-foreground">Administrador</span><p className="mt-2 font-semibold">{administrator.name || "Administrador"}</p><p className="text-sm text-muted-foreground break-all">{administrator.email}</p><p className="mt-1 text-xs text-muted-foreground">{data.data?.proposals.filter(x => x.owner_id === administrator.id).length ?? 0} propostas</p></div></div><CommissionSettings userId={administrator.id} title="Minhas comissões" /></div>}\n'
          text = req(text, marker, admin_block, 'administrator commissions card')
          path.write_text(text)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/vendedor.tsx src/routes/_authenticated/configuracoes.tsx src/components/CommissionSettings.tsx
          git rm .github/workflows/compact-proposal-kanban.yml
          git commit -m 'Compacta kanban de propostas e organiza comissões'
          git push
