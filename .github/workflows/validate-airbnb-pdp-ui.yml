name: Validar Airbnb fotos avaliacao e propostas

on:
  push:
    branches:
      - feature/airbnb-pdp-details-rating-gallery-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Testar detalhes e propostas Airbnb
        run: bun run test src/lib/airbnb-pdp-details.test.ts src/lib/customer-airbnb-proposal.test.ts
      - name: Verificar TypeScript
        run: bunx tsc --noEmit
      - name: Compilar sistema
        run: bun run build
