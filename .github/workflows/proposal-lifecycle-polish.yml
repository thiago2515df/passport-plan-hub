name: Proposal lifecycle polish
on:
  push:
    paths:
      - .github/workflows/proposal-lifecycle-polish.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Polish archive behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/vendedor.tsx')
          s = p.read_text()
          s = s.replace('''        <div className="grid grid-cols-1 items-start gap-3 lg:grid-cols-3">\n          {columns.map''', '''        {!showArchive && <div className="grid grid-cols-1 items-start gap-3 lg:grid-cols-3">\n          {columns.map''', 1)
          s = s.replace('''        </div>\n        {showArchive && <section className="rounded-2xl border border-border bg-card p-3 sm:p-4">''', '''        </div>}\n        {showArchive && <section className="rounded-2xl border border-border bg-card p-3 sm:p-4">''', 1)
          s = s.replace('''{["approved", "cancelled"].includes(row.status) && <Button size="sm" variant="ghost" onClick={() => request(row.code, "created")}>Reabrir</Button>}''', '''''')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/vendedor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deixa arquivo oculto e preserva propostas aprovadas"
          git push
