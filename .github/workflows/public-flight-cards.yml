name: Public flight cards

on:
  push:
    paths:
      - '.github/workflows/public-flight-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public flight cards
        run: echo '' | base64 -d | python3
      - name: Commit public proposal update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/public-flight-cards.yml
          git add src/components/TransportPanel.tsx
          git commit -m 'Melhora cards de voo da proposta pública'
          git push
