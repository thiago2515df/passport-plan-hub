name: Verify Trivago error recovery
on:
  push:
    paths:
      - '.github/workflows/check-trivago-recovery.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test Trivago adapter
        run: bunx vitest run src/lib/trivago-adapter.test.ts
      - name: Build
        run: bun run build
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-trivago-recovery.yml
          git commit -m "Remove teste temporário de recuperação Trivago"
          git push
