name: Fix mobile guests stepper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-guests-stepper.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace mobile guest inputs with steppers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/routes/_authenticated/pacotes.tsx')
          text = path.read_text()
          old = '''      <details className="relative text-sm"><summary className="list-none">Quartos e hóspedes<div className={field + " mt-2 cursor-pointer"}><Users className="h-4 w-4" />{hosp}</div></summary><div className="absolute z-20 mt-1 w-64 space-y-2 rounded-xl border border-border bg-card p-3 shadow-lg"><div className="flex justify-between">Quartos<input type="number" min={1} max={9} className={num} value={rooms} onChange={e => setRooms(Math.max(1, Math.min(9, +e.target.value)))} /></div><div className="flex justify-between">Adultos<input type="number" min={1} max={9} className={num} value={adults} onChange={e => setAdults(Math.max(1, Math.min(9, +e.target.value)))} /></div><div className="flex justify-between">Crianças<input type="number" min={0} max={4} className={num} value={kids.length} onChange={e => { const n = Math.max(0, Math.min(4, +e.target.value)); setKids(k => Array.from({ length: n }, (_, i) => k[i] ?? 7)); }} /></div>{kids.map((a, i) => <div key={i} className="flex justify-between text-xs text-muted-foreground">Idade criança {i + 1}<input type="number" min={0} max={17} className={num} value={a} onChange={e => setKids(k => k.map((v, j) => j === i ? Math.max(0, Math.min(17, +e.target.value)) : v))} /></div>)}</div></details>
'''
          new = '''      <details className="relative text-sm"><summary className="list-none">Quartos e hóspedes<div className={field + " mt-2 cursor-pointer"}><Users className="h-4 w-4" />{hosp}</div></summary><div className="absolute left-0 right-0 z-30 mt-2 space-y-3 rounded-2xl border border-border bg-card p-4 shadow-xl md:hidden"><div className="flex items-center justify-between gap-3"><span className="font-medium">Quartos</span><div className="flex items-center gap-2"><button type="button" aria-label="Diminuir quartos" disabled={rooms <= 1} onClick={() => setRooms(v => Math.max(1, v - 1))} className="grid h-11 w-11 place-items-center rounded-full border border-border bg-background text-2xl font-semibold text-primary disabled:opacity-35">−</button><span className="w-8 text-center text-lg font-bold tabular-nums">{rooms}</span><button type="button" aria-label="Aumentar quartos" disabled={rooms >= 9} onClick={() => setRooms(v => Math.min(9, v + 1))} className="grid h-11 w-11 place-items-center rounded-full bg-primary text-2xl font-semibold text-primary-foreground disabled:opacity-35">+</button></div></div><div className="flex items-center justify-between gap-3"><span className="font-medium">Adultos</span><div className="flex items-center gap-2"><button type="button" aria-label="Diminuir adultos" disabled={adults <= 1} onClick={() => setAdults(v => Math.max(1, v - 1))} className="grid h-11 w-11 place-items-center rounded-full border border-border bg-background text-2xl font-semibold text-primary disabled:opacity-35">−</button><span className="w-8 text-center text-lg font-bold tabular-nums">{adults}</span><button type="button" aria-label="Aumentar adultos" disabled={adults >= 9} onClick={() => setAdults(v => Math.min(9, v + 1))} className="grid h-11 w-11 place-items-center rounded-full bg-primary text-2xl font-semibold text-primary-foreground disabled:opacity-35">+</button></div></div><div className="flex items-center justify-between gap-3"><span className="font-medium">Crianças</span><div className="flex items-center gap-2"><button type="button" aria-label="Diminuir crianças" disabled={kids.length <= 0} onClick={() => setKids(k => k.slice(0, -1))} className="grid h-11 w-11 place-items-center rounded-full border border-border bg-background text-2xl font-semibold text-primary disabled:opacity-35">−</button><span className="w-8 text-center text-lg font-bold tabular-nums">{kids.length}</span><button type="button" aria-label="Aumentar crianças" disabled={kids.length >= 4} onClick={() => setKids(k => [...k, 7])} className="grid h-11 w-11 place-items-center rounded-full bg-primary text-2xl font-semibold text-primary-foreground disabled:opacity-35">+</button></div></div>{kids.map((a, i) => <div key={i} className="flex items-center justify-between gap-3 border-t border-border pt-3 text-xs text-muted-foreground"><span>Idade criança {i + 1}</span><div className="flex items-center gap-2"><button type="button" aria-label={`Diminuir idade da criança ${i + 1}`} disabled={a <= 0} onClick={() => setKids(k => k.map((v, j) => j === i ? Math.max(0, v - 1) : v))} className="grid h-9 w-9 place-items-center rounded-full border border-border bg-background text-xl font-semibold text-primary disabled:opacity-35">−</button><span className="w-8 text-center text-sm font-bold tabular-nums text-foreground">{a}</span><button type="button" aria-label={`Aumentar idade da criança ${i + 1}`} disabled={a >= 17} onClick={() => setKids(k => k.map((v, j) => j === i ? Math.min(17, v + 1) : v))} className="grid h-9 w-9 place-items-center rounded-full bg-primary text-xl font-semibold text-primary-foreground disabled:opacity-35">+</button></div></div>)}<p className="text-[11px] text-muted-foreground">Limites da busca: até 9 adultos, 9 quartos e 4 crianças.</p><button type="button" onClick={e => e.currentTarget.closest('details')?.removeAttribute('open')} className="h-11 w-full rounded-xl bg-primary font-bold text-primary-foreground">Pronto</button></div><div className="absolute z-20 mt-1 hidden w-64 space-y-2 rounded-xl border border-border bg-card p-3 shadow-lg md:block"><div className="flex justify-between">Quartos<input type="number" min={1} max={9} className={num} value={rooms} onChange={e => setRooms(Math.max(1, Math.min(9, +e.target.value)))} /></div><div className="flex justify-between">Adultos<input type="number" min={1} max={9} className={num} value={adults} onChange={e => setAdults(Math.max(1, Math.min(9, +e.target.value)))} /></div><div className="flex justify-between">Crianças<input type="number" min={0} max={4} className={num} value={kids.length} onChange={e => { const n = Math.max(0, Math.min(4, +e.target.value)); setKids(k => Array.from({ length: n }, (_, i) => k[i] ?? 7)); }} /></div>{kids.map((a, i) => <div key={i} className="flex justify-between text-xs text-muted-foreground">Idade criança {i + 1}<input type="number" min={0} max={17} className={num} value={a} onChange={e => setKids(k => k.map((v, j) => j === i ? Math.max(0, Math.min(17, +e.target.value)) : v))} /></div>)}</div></details>
'''
          if old not in text:
              raise SystemExit('Guest selector snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify build
        run: npm run build
      - name: Commit mobile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- package-lock.json 2>/dev/null || true
          git add src/routes/_authenticated/pacotes.tsx
          git rm .github/workflows/fix-mobile-guests-stepper.yml
          git commit -m 'Melhora seletor de hóspedes no celular'
          git push
