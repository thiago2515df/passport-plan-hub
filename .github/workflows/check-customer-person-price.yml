name: Verify public per-person package price
on:
  push:
    paths:
      - '.github/workflows/check-customer-person-price.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bunx vitest run src/lib/customer-package-price.test.ts src/lib/customer-airbnb-proposal.test.ts
      - name: Build
        run: bun run build
      - name: Remove temporary check
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-customer-person-price.yml
          git commit -m "Remove teste temporário preço por pessoa"
          git push
