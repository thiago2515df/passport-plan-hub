name: Verify PassHub Data API setup
on:
  push:
    paths:
      - '.github/workflows/verify-passhub-data-api.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test server-only integration
        run: bunx vitest run src/lib/passhub-data.server.test.ts
      - name: Build application
        run: bun run build
      - name: Remove temporary check
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-passhub-data-api.yml
          git commit -m "Remove teste temporário da API de dados PassHub"
          git push
