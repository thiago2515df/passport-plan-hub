name: Verify guest-count fare invalidation
on:
  push:
    paths:
      - '.github/workflows/check-room-fares.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/lib/room-occupancy.test.ts
      - run: bun run build
      - name: Remove temporary check
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-room-fares.yml
          git commit -m "Remove teste temporário dos hóspedes"
          git push
