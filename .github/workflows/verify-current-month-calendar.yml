name: Verify current-month calendars
on:
  push:
    paths:
      - '.github/workflows/verify-current-month-calendar.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test current-month dates and crossings
        run: bunx vitest run src/lib/travel-calendar-dates.test.ts
      - name: Build site and app
        run: bun run build
      - name: Remove temporary test workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-current-month-calendar.yml
          git commit -m "Remove teste temporário calendário"
          git push
