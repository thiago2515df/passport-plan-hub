name: Validar detalhes da proposta pública

on:
  push:
    branches:
      - fix/public-proposal-hotel-details-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependências
        run: bun install --frozen-lockfile
      - name: Testar propostas públicas sem IDs internos
        run: bun run test src/lib/hotel-listing-id.test.ts
      - name: Verificar tipagem
        run: bunx tsc --noEmit
      - name: Compilar aplicativo web
        run: bun run build
