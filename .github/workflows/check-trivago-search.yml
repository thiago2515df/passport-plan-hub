name: Verify Trivago supplier search fix
on:
  push:
    paths:
      - '.github/workflows/check-trivago-search.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install packages
        run: bun install --frozen-lockfile
      - name: Run Trivago tests
        run: bunx vitest run src/lib/trivago-adapter.test.ts
      - name: Build the site
        run: bun run build
      - name: Remove temporary check
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/check-trivago-search.yml
          git commit -m "Remove teste temporário Trivago"
          git push
