name: Verify editing saved flights
on:
  push:
    paths:
      - '.github/workflows/test-edit-proposal-flights.yml'
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test flight restoration
        run: bunx vitest run src/lib/proposal-edit-flights.test.ts src/test/customer-itinerary.test.ts
      - name: Build
        run: bun run build
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/test-edit-proposal-flights.yml
          git commit -m "Remove teste temporário de edição de voos"
          git push
