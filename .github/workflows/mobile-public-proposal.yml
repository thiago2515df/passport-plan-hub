name: Mobile public proposal

on:
  push:
    paths:
      - '.github/workflows/mobile-public-proposal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile-first public proposal layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Add stable semantic classes to the public proposal so mobile CSS is not tied to Tailwind internals.
          p = Path('src/routes/proposta.tsx')
          s = p.read_text()
          replacements = {
            'className="proposta min-h-screen bg-background pb-28 text-foreground"': 'className="proposta proposal-public min-h-screen overflow-x-hidden bg-background pb-40 text-foreground sm:pb-28"',
            'className="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3"': 'className="proposal-header-inner mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3"',
            'className="relative mx-auto max-w-6xl px-5 pb-16 pt-10 text-card md:pb-24 md:pt-16"': 'className="proposal-hero-content relative mx-auto max-w-6xl px-5 pb-16 pt-10 text-card md:pb-24 md:pt-16"',
            'className="relative z-10 mx-auto max-w-6xl px-4"': 'className="proposal-main relative z-10 mx-auto max-w-6xl px-4"',
            'className="mt-4 grid grid-cols-3 rounded-t-2xl border-b border-border bg-card"': 'className="proposal-tabs mt-4 grid grid-cols-3 rounded-t-2xl border-b border-border bg-card"',
            '{p.s.transport && hasTransport && <div className="mt-8"><h2': '{p.s.transport && hasTransport && <div className="proposal-flight-section mt-8"><h2',
            'className="mt-5 grid gap-6 md:grid-cols-2 lg:grid-cols-3"': 'className="proposal-hotels-grid mt-5 grid gap-6 md:grid-cols-2 lg:grid-cols-3"',
            'className={`flex flex-col rounded-3xl bg-card p-3 shadow-sm transition ${sel ? "ring-[3px] ring-primary" : "ring-1 ring-border"}`}': 'className={`proposal-hotel-card flex flex-col rounded-3xl bg-card p-3 shadow-sm transition ${sel ? "ring-[3px] ring-primary" : "ring-1 ring-border"}`}',
            'className="relative block overflow-hidden rounded-2xl [&_img]:!h-56 [&_img]:!w-full [&>div]:!h-56 [&>div]:!w-full"': 'className="proposal-hotel-image relative block overflow-hidden rounded-2xl [&_img]:!h-56 [&_img]:!w-full [&>div]:!h-56 [&>div]:!w-full"',
            'className="flex flex-1 flex-col px-2 pt-3"': 'className="proposal-hotel-body flex flex-1 flex-col px-2 pt-3"',
            'className="fixed inset-x-0 bottom-0 z-40 border-t border-border bg-card shadow-2xl"': 'className="proposal-selection-bar fixed inset-x-0 bottom-0 z-40 border-t border-border bg-card shadow-2xl"',
            'className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3"': 'className="proposal-selection-inner mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3"',
          }
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Make hotel details behave like a mobile app sheet/full-screen view.
          g = Path('src/components/HotelGallery.tsx')
          t = g.read_text()
          gallery_replacements = {
            'className="fixed inset-0 z-50 grid place-items-center bg-foreground/70 p-4"': 'className="hotel-gallery-overlay fixed inset-0 z-50 grid place-items-center bg-foreground/70 p-4"',
            'className="max-h-[92vh] w-full max-w-4xl overflow-auto rounded-2xl bg-card p-4 shadow-2xl"': 'className="hotel-gallery-panel max-h-[92vh] w-full max-w-4xl overflow-auto rounded-2xl bg-card p-4 shadow-2xl"',
            'className="mb-3 flex items-start justify-between gap-4"': 'className="hotel-gallery-header mb-3 flex items-start justify-between gap-4"',
            'className="relative grid aspect-video place-items-center overflow-hidden rounded-xl bg-secondary"': 'className="hotel-gallery-main-photo relative grid aspect-video place-items-center overflow-hidden rounded-xl bg-secondary"',
          }
          for old, new in gallery_replacements.items():
            if old in t:
              t = t.replace(old, new, 1)
          g.write_text(t)

          # Append dedicated mobile CSS. Desktop remains unchanged.
          css = Path('src/styles.css')
          c = css.read_text()
          marker = '/* Public proposal mobile-first polish */'
          block = r'''

/* Public proposal mobile-first polish */
.proposal-public {
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

.proposal-public img { max-width: 100%; }
.proposal-hotel-card,
.proposal-hotel-body,
.proposal-hotel-body > * { min-width: 0; }

@media (max-width: 640px) {
  .proposal-header-inner {
    min-height: 56px;
    gap: .5rem;
    padding: .5rem .75rem;
  }
  .proposal-header-inner img { height: 2.15rem; }
  .proposal-header-inner a {
    gap: .4rem;
    border-width: 1.5px;
    border-radius: .75rem;
    padding: .45rem .7rem;
    font-size: .75rem;
  }

  .proposal-hero-content { padding: 1.4rem 1rem 1.8rem; }
  .proposal-hero-content h1 {
    margin-top: 0;
    font-size: 2rem;
    line-height: 1.08;
    letter-spacing: -.03em;
  }
  .proposal-hero-content > .mt-5 { margin-top: .85rem; gap: .4rem; }
  .proposal-hero-content > .mt-5 > span {
    gap: .35rem;
    padding: .38rem .65rem;
    font-size: .72rem;
  }
  .proposal-hero-content > .mt-6 { margin-top: .95rem; padding-left: .75rem; }
  .proposal-hero-content > .mt-6 p { font-size: .86rem; line-height: 1.4; }

  .proposal-main { padding-inline: .75rem; }
  .proposal-tabs {
    position: sticky;
    top: 56px;
    z-index: 20;
    margin-top: .5rem;
    overflow: hidden;
    border: 1px solid var(--color-border);
    border-radius: .9rem;
    box-shadow: 0 5px 18px rgba(15, 35, 70, .06);
  }
  .proposal-tabs button {
    min-width: 0;
    gap: .25rem;
    padding: .58rem .2rem;
    font-size: .72rem;
  }
  .proposal-tabs button > span {
    width: 1.55rem;
    height: 1.55rem;
    flex: 0 0 auto;
    font-size: .7rem;
  }

  .proposal-flight-section { margin-top: 1.25rem; }
  .proposal-flight-section > h2 { margin-bottom: .65rem; font-size: 1.35rem; }
  .proposal-public [aria-label="Itinerário"] { gap: .65rem; }
  .proposal-public [aria-label="Itinerário"] article {
    border-width: 1.5px;
    border-radius: 1rem;
    padding: .8rem;
    box-shadow: 0 5px 18px rgba(18, 48, 95, .045);
  }
  .proposal-public [aria-label="Itinerário"] article > div { gap: .65rem; }
  .proposal-public [aria-label="Itinerário"] article .text-xl,
  .proposal-public [aria-label="Itinerário"] article .sm\:text-2xl { font-size: 1.18rem; }
  .proposal-public [aria-label="Itinerário"] article .text-sm { font-size: .76rem; }
  .proposal-public [aria-label="Itinerário"] article .mt-4 { margin-top: .7rem; }

  .proposal-main > h2,
  .proposal-flight-section + h2 { font-size: 1.35rem; }
  .proposal-flight-section + h2 { margin-top: 1.55rem; }
  .proposal-flight-section + h2 + p { font-size: .78rem; line-height: 1.45; }

  .proposal-hotels-grid {
    margin-top: .9rem;
    gap: .85rem;
  }
  .proposal-hotel-card {
    border-radius: 1.15rem;
    padding: .45rem;
    box-shadow: 0 6px 20px rgba(15, 40, 80, .055);
  }
  .proposal-hotel-image { border-radius: .9rem; }
  .proposal-hotel-image img,
  .proposal-hotel-image > div {
    height: 9.5rem !important;
    min-height: 9.5rem !important;
    width: 100% !important;
    object-fit: cover !important;
  }
  .proposal-hotel-image > span {
    top: .55rem;
    left: .55rem;
    padding: .3rem .55rem;
    font-size: .68rem;
  }
  .proposal-hotel-body { padding: .6rem .35rem .3rem; }
  .proposal-hotel-body > h3 { font-size: 1.02rem; line-height: 1.22; }
  .proposal-hotel-body > .mt-1 { gap: .3rem; font-size: .72rem; }
  .proposal-hotel-body > .mt-1 svg { width: .9rem; height: .9rem; }
  .proposal-hotel-body > .mt-2.flex { margin-top: .4rem; }
  .proposal-hotel-body > .mt-2.flex svg { width: .85rem; height: .85rem; }
  .proposal-hotel-body > .mt-2.text-xs { margin-top: .4rem; font-size: .7rem; }
  .proposal-hotel-body ul { margin-top: .55rem; gap: .15rem; font-size: .78rem; line-height: 1.35; }
  .proposal-hotel-body ul > li:first-child { font-size: .68rem; }
  .proposal-hotel-body ul svg { width: .9rem; height: .9rem; }
  .proposal-hotel-body > .mt-3.border-t {
    margin-top: .65rem;
    padding-top: .6rem;
  }
  .proposal-hotel-body > .mt-3.border-t > .text-xs { font-size: .68rem; }
  .proposal-hotel-body > .mt-3.border-t > .text-2xl { margin-top: .08rem; font-size: 1.35rem; }
  .proposal-hotel-body > .mt-auto {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .45rem;
    padding-top: .65rem;
  }
  .proposal-hotel-body > .mt-auto > * {
    min-height: 40px;
    padding: .5rem .45rem;
    font-size: .72rem;
    line-height: 1.2;
  }
  .proposal-hotel-body > .mt-auto svg { width: .9rem; height: .9rem; }

  .proposal-selection-inner {
    flex-direction: column;
    align-items: stretch;
    gap: .45rem;
    padding: .55rem .75rem max(.55rem, env(safe-area-inset-bottom));
  }
  .proposal-selection-inner > div:first-child {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
  }
  .proposal-selection-inner > div:first-child > .text-xl { font-size: 1.05rem; }
  .proposal-selection-inner > .flex {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 42px;
    gap: .45rem;
  }
  .proposal-selection-inner > .flex > button {
    width: 100%;
    min-width: 0;
    justify-content: center;
    padding: .6rem .7rem;
    font-size: .76rem;
  }
  .proposal-selection-inner > .flex > a {
    width: 42px;
    height: 42px;
    justify-content: center;
    overflow: hidden;
    padding: 0;
    font-size: 0;
  }
  .proposal-selection-inner > .flex > a svg { width: 18px; height: 18px; }

  .hotel-gallery-overlay {
    place-items: end stretch;
    padding: 0;
    background: rgba(10, 20, 40, .72);
  }
  .hotel-gallery-panel {
    width: 100%;
    max-width: none;
    height: 100dvh;
    max-height: 100dvh;
    border-radius: 0;
    padding: .75rem;
    overscroll-behavior: contain;
  }
  .hotel-gallery-header {
    position: sticky;
    top: -.75rem;
    z-index: 10;
    margin: -.75rem -.75rem .65rem;
    padding: .75rem;
    border-bottom: 1px solid var(--color-border);
    background: color-mix(in oklab, var(--color-card) 96%, transparent);
    backdrop-filter: blur(10px);
  }
  .hotel-gallery-header .text-lg { font-size: 1rem; }
  .hotel-gallery-main-photo {
    aspect-ratio: 4 / 3;
    border-radius: .85rem;
  }
  .hotel-gallery-main-photo img { object-fit: cover; }
  .hotel-gallery-panel .h-16.w-24 { width: 5rem; height: 3.3rem; }
  .hotel-gallery-panel section { margin-top: .85rem; padding-top: .85rem; }
  .hotel-gallery-panel section p { font-size: .82rem; line-height: 1.55; }
}
'''
          if marker not in c:
              c += block
          css.write_text(c)
          PY

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit responsive proposal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-public-proposal.yml
          git add src/routes/proposta.tsx src/components/HotelGallery.tsx src/styles.css
          git commit -m 'Otimiza proposta pública para celular'
          git push
