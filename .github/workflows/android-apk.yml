name: Android APK de teste
on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-pwa-excursao-brasilia
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Android SDK is preinstalled on GitHub's Ubuntu runner.
      # Avoid setup-android's sdkmanager update, which fails on this runner.
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare official Android icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp ../public/icon-512.png app/src/main/res/drawable-nodpi/app_logo.png
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Excursao-Brasilia-APK-Teste
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
