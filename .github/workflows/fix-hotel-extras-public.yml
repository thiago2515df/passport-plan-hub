name: Fix hotel extras public proposal

on:
  push:
    paths:
      - '.github/workflows/fix-hotel-extras-public.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/_authenticated/pacotes.tsx')
          s = p.read_text()
          old = '''      const restored = proposal.hotels.map((hotel, index) => ({ ...hotel, id: `saved-${index}`, x: 50, y: 50 }));'''
          new = '''      const restored = proposal.hotels.map((hotel, index) => {
        const rawRoom = hotel.room ?? "";
        const hasEmbeddedExtras = /\\s*__EBX__(.+)$/.test(rawRoom);
        const extraCost = hasEmbeddedExtras ? (hotel.extras ?? []).reduce((sum, item) => sum + item.cost, 0) : 0;
        return { ...hotel, room: rawRoom.replace(/\\s*__EBX__(.+)$/, ""), total: Math.max(0, hotel.total - extraCost), id: `saved-${index}`, x: 50, y: 50 };
      });'''
          assert old in s, 'restored pattern not found'
          s = s.replace(old, new, 1)

          old = '''    const chosen = sel.map(id => hotels.find(h => h.id === id)).filter((h): h is Hotel => Boolean(h)).map(({ id: _i, x: _x, y: _y, ...h }) => ({ ...h, name: h.name.slice(0, 120) }));'''
          new = '''    const chosen = sel.map(id => hotels.find(h => h.id === id)).filter((h): h is Hotel => Boolean(h)).map(({ id: _i, x: _x, y: _y, ...h }) => {
      const extras = h.extras ?? [];
      const extraCost = extras.reduce((sum, item) => sum + item.cost, 0);
      const extraNames = extras.map(item => item.name.trim()).filter(Boolean);
      const cleanRoom = (h.room ?? "").replace(/\\s*__EBX__(.+)$/, "");
      const room = extraNames.length ? `${cleanRoom} __EBX__${encodeURIComponent(JSON.stringify(extraNames))}` : cleanRoom;
      return { ...h, room, total: h.total + extraCost, name: h.name.slice(0, 120) };
    });'''
          assert old in s, 'chosen pattern not found'
          s = s.replace(old, new, 1)

          old = '''payload: encodeProposal({ s: { ...s, hospedes: hosp, destinationId: destId, rooms, adults, childAges: kids }, hotels: chosen })'''
          new = '''payload: encodeProposal({ s: { ...s, extras: [], hospedes: hosp, destinationId: destId, rooms, adults, childAges: kids }, hotels: chosen })'''
          assert old in s, 'payload pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/routes/proposta.tsx')
          s = p.read_text()
          old = '''                const [room, meal] = (h.room ?? "").split(" · ");
                const sel = chosenIndex === i;
                const included = [
                  hasTransport ? (p.s.transport?.mode === "bus" ? "Passagem de ônibus (ida e volta)" : "Passagem aérea (ida e volta)") : null,
                  `Hospedagem · ${nights} ${nights === 1 ? "noite" : "noites"}`,
                  hasBreakfast(meal) ? `Café da manhã${meal ? ` (${meal})` : ""}` : null,
                  ...(h.extras ?? p.s.extras ?? []).map(item => item.name.trim()),
                ].filter(Boolean) as string[];'''
          new = '''                const rawRoom = h.room ?? "";
                const marker = rawRoom.match(/\\s*__EBX__(.+)$/);
                let embeddedExtras: string[] = [];
                if (marker?.[1]) {
                  try {
                    const parsed = JSON.parse(decodeURIComponent(marker[1]));
                    if (Array.isArray(parsed)) embeddedExtras = parsed.map(String).map(x => x.trim()).filter(Boolean);
                  } catch { embeddedExtras = []; }
                }
                const cleanRoom = rawRoom.replace(/\\s*__EBX__(.+)$/, "");
                const [room, meal] = cleanRoom.split(" · ");
                const sel = chosenIndex === i;
                const extraNames = h.extras?.length ? h.extras.map(item => item.name.trim()).filter(Boolean) : embeddedExtras.length ? embeddedExtras : (p.s.extras ?? []).map(item => item.name.trim()).filter(Boolean);
                const included = [
                  hasTransport ? (p.s.transport?.mode === "bus" ? "Passagem de ônibus (ida e volta)" : "Passagem aérea (ida e volta)") : null,
                  `Hospedagem · ${nights} ${nights === 1 ? "noite" : "noites"}`,
                  hasBreakfast(meal) ? `Café da manhã${meal ? ` (${meal})` : ""}` : null,
                  ...extraNames,
                ].filter(Boolean) as string[];'''
          assert old in s, 'proposal card pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/customer-proposal.ts')
          s = p.read_text()
          old = '''    const extras = h.extras ?? s.extras ?? [];
    return { name: h.name, address: h.address, stars: h.stars, room: h.room ?? "", image: h.image, ...(h.hotelId !== undefined ? { hotelId: h.hotelId } : {}), extras: extras.map(item => ({ name: item.name, cost: 0 })), nightly: 0, total: packagePricing(h.total, { ...s, extras }, commissions).total };'''
          new = '''    const extras = h.extras ?? s.extras ?? [];
    const extrasAlreadyInHotelTotal = /\\s*__EBX__(.+)$/.test(h.room ?? "");
    return { name: h.name, address: h.address, stars: h.stars, room: h.room ?? "", image: h.image, ...(h.hotelId !== undefined ? { hotelId: h.hotelId } : {}), extras: extras.map(item => ({ name: item.name, cost: 0 })), nightly: 0, total: packagePricing(h.total, { ...s, extras: extrasAlreadyInHotelTotal ? [] : extras }, commissions).total };'''
          assert old in s, 'customer proposal pattern not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-hotel-extras-public.yml
          git add src/routes/_authenticated/pacotes.tsx src/routes/proposta.tsx src/lib/customer-proposal.ts
          git commit -m 'Exibe adicionais individuais na proposta pública'
          git push
